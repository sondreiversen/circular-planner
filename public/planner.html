<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Planner</title>
  <link rel="icon" href="/favicon.svg">
  <script src="/theme-init.js?v=2"></script>
  <link rel="preload" as="script" href="/js/planner-bundle.js?v=2">
  <link rel="stylesheet" href="/css/app.css?v=2">
  <link rel="stylesheet" href="/css/circular-planner.css?v=2">
</head>
<body class="app-page">
  <header class="app-header">
    <div class="header-left">
      <a href="/dashboard.html" class="back-link">← Dashboard</a>
      <span id="planner-title-header" class="planner-breadcrumb"></span>
    </div>
    <div class="header-right">
      <button id="share-btn" class="btn btn-ghost" title="Share this planner">Share</button>
      <span id="header-username" class="header-user"></span>
      <button id="guide-btn" class="btn btn-ghost" title="Guide & help">Guide</button>
      <button id="help-btn" class="btn-theme" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
      <button id="theme-toggle" class="btn-theme" title="Toggle dark mode">🌙</button>
      <button id="logout-btn" class="btn btn-ghost">Sign Out</button>
    </div>
  </header>

  <main class="planner-main">
    <div id="planner-loading" class="skeleton-disc-wrap" aria-label="Loading planner…" role="status">
      <div class="skeleton-disc"></div>
    </div>
    <div id="planner-error" class="error-state hidden"></div>
    <div id="planner-container" class="hidden"></div>
  </main>

  <!-- Share dialog -->
  <div id="share-overlay" class="overlay hidden">
    <div class="dialog-card dialog-card--wide">
      <h3>Share Planner</h3>

      <!-- Tabs -->
      <div class="tab-bar" style="margin-bottom:0;">
        <button class="tab active" id="share-tab-users" type="button">Users</button>
        <button class="tab" id="share-tab-groups" type="button">Groups</button>
        <button class="tab" id="share-tab-public" type="button">Public link</button>
      </div>

      <!-- Users panel -->
      <div id="share-panel-users">
        <div class="share-public-row">
          <label class="share-public-label">
            <input type="checkbox" id="share-make-public">
            <span>Public — anyone logged in can view</span>
          </label>
          <p class="share-public-hint">When on, this planner appears in the Discover section for all registered users on this instance. Edit access is unaffected.</p>
          <div id="share-public-feedback" class="share-public-feedback hidden"></div>
        </div>
        <div id="share-error" class="form-error hidden"></div>
        <div id="share-list" class="share-list"></div>
        <form id="share-form" class="share-add-form">
          <label>
            Add by email
            <input type="email" id="share-email" placeholder="user@example.com">
          </label>
          <label>
            Permission
            <select id="share-permission">
              <option value="view">View only</option>
              <option value="edit">Can edit</option>
            </select>
          </label>
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
      </div>

      <!-- Groups panel -->
      <div id="share-panel-groups" class="hidden">
        <div id="share-group-error" class="form-error hidden"></div>
        <div id="share-group-list" class="share-list"></div>
        <div class="share-add-form" style="align-items:flex-end;flex-wrap:wrap;gap:10px;">
          <label style="flex:1;min-width:180px;">
            My group
            <select id="share-group-select">
              <option value="">— select a group —</option>
            </select>
          </label>
          <label>
            Default permission
            <select id="share-group-permission">
              <option value="view">View only</option>
              <option value="edit">Can edit</option>
            </select>
          </label>
          <button id="share-group-add-btn" class="btn btn-primary" type="button">Add Group</button>
        </div>
      </div>

      <!-- Public link panel -->
      <div id="share-panel-public" class="hidden">
        <div class="share-token-section">
          <h4>Public link</h4>
          <p class="share-public-hint">Anyone with this link can view this planner without logging in.</p>
          <div id="share-token-no-token">
            <button id="share-token-enable-btn" class="btn btn-primary" type="button">Enable public link</button>
          </div>
          <div id="share-token-active" class="hidden">
            <div class="share-token-url-row">
              <input type="text" id="share-token-url-input" readonly>
              <button id="share-token-copy-btn" class="btn btn-ghost" type="button">Copy</button>
            </div>
            <textarea id="share-token-embed-code" class="share-token-embed" readonly></textarea>
            <div class="share-token-actions">
              <button id="share-token-revoke-btn" class="btn-danger-sm" type="button">Revoke link</button>
            </div>
            <p class="share-token-warning">Anyone with this link can view this planner without logging in.</p>
          </div>
          <div id="share-token-error" class="form-error hidden"></div>
        </div>
      </div>

      <div class="dialog-actions">
        <button id="share-close" class="btn btn-ghost">Close</button>
      </div>
    </div>
  </div>

  <script src="/js/planner-bundle.js?v=2"></script>
</body>
</html>
