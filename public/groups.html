<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groups — Circular Planner</title>
  <link rel="icon" href="/favicon.svg">
  <script src="/theme-init.js?v=2"></script>
  <link rel="preload" as="script" href="/js/groups-bundle.js?v=2">
  <link rel="stylesheet" href="/css/app.css?v=2">
</head>
<body class="app-page">
  <header class="app-header">
    <div class="header-left">
      <a href="/dashboard.html" class="back-link">← Dashboard</a>
    </div>
    <div class="header-right">
      <span id="header-username" class="header-user"></span>
      <button id="theme-toggle" class="btn-theme" title="Toggle dark mode">🌙</button>
      <button id="logout-btn" class="btn btn-ghost">Sign Out</button>
    </div>
  </header>

  <main id="groups-main" class="groups-page">
    <div id="list-view">
      <div class="dashboard-title-row">
        <h2>My Groups</h2>
        <button id="new-group-btn" class="btn btn-primary">+ New Group</button>
      </div>
      <div id="groups-grid" class="groups-grid">
        <div class="loading-state">Loading groups…</div>
      </div>
    </div>

    <div id="detail-view" class="hidden group-detail">
      <div class="group-detail-header">
        <div>
          <div id="detail-name" class="group-detail-title"></div>
          <div id="detail-desc" class="group-detail-desc-edit" title="Click to edit"></div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0;">
          <button id="edit-group-btn" class="btn btn-ghost hidden">Edit</button>
          <button id="delete-group-btn" class="btn btn-danger hidden">Delete Group</button>
        </div>
      </div>

      <!-- Inline edit form (hidden by default) -->
      <div id="edit-form-wrap" class="hidden">
        <div id="edit-error" class="form-error hidden"></div>
        <div class="edit-name-form">
          <label>Name<input type="text" id="edit-name-input"></label>
          <label>Description<input type="text" id="edit-desc-input"></label>
          <button id="edit-save-btn" class="btn btn-primary">Save</button>
          <button id="edit-cancel-btn" class="btn btn-ghost">Cancel</button>
        </div>
      </div>

      <div class="members-section">
        <h3>Members</h3>
        <div id="members-list" class="members-list">
          <div class="loading-state">Loading members…</div>
        </div>

        <!-- Add member form (admin only) -->
        <div id="add-member-form" class="add-member-form hidden">
          <h4>Add Member</h4>
          <div id="add-member-error" class="form-error hidden"></div>
          <div id="member-chips" class="member-chips"></div>
          <div class="add-member-fields">
            <label>
              Search user
              <input type="text" id="member-search" placeholder="Username or email…" autocomplete="off">
            </label>
            <label>
              Role
              <select id="member-role">
                <option value="member">Member</option>
                <option value="admin">Admin</option>
              </select>
            </label>
            <button id="add-member-btn" class="btn btn-primary" disabled>Add</button>
          </div>
          <div id="member-search-results" class="search-results hidden"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- New group dialog -->
  <div id="new-group-overlay" class="overlay hidden">
    <div class="dialog-card">
      <h3>New Group</h3>
      <div id="ng-error" class="form-error hidden"></div>
      <form id="new-group-form">
        <label>
          Name
          <input type="text" id="ng-name" placeholder="e.g. Platform Team" required>
        </label>
        <label>
          Description <span class="hint">(optional)</span>
          <input type="text" id="ng-desc" placeholder="What this group is for">
        </label>
        <div class="dialog-actions">
          <button type="button" id="ng-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/groups-bundle.js?v=2"></script>
</body>
</html>
