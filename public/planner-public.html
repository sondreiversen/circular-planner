<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Planner — Public View</title>
  <link rel="icon" href="/favicon.svg">
  <script src="/theme-init.js?v=2"></script>
  <link rel="preload" as="script" href="/js/planner-public-bundle.js?v=2">
  <link rel="stylesheet" href="/css/app.css?v=2">
  <link rel="stylesheet" href="/css/circular-planner.css?v=2">
</head>
<body class="app-page">
  <header class="app-header">
    <div class="header-left">
      <span id="planner-title-header" class="planner-breadcrumb"></span>
    </div>
    <div class="header-right">
      <span class="public-view-badge" title="Read-only public view — anyone with this link can view this planner">Public view</span>
      <button id="theme-toggle" class="btn-theme" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <div class="public-view-banner">
    Read-only public view. Anyone with this link can view this planner.
  </div>

  <main class="planner-main">
    <div id="planner-loading" class="skeleton-disc-wrap" aria-label="Loading planner…" role="status">
      <div class="skeleton-disc"></div>
    </div>
    <div id="planner-error" class="error-state hidden"></div>
    <div id="planner-container" class="hidden"></div>
  </main>

  <script src="/js/planner-public-bundle.js?v=2"></script>
</body>
</html>
