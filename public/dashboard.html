<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Planner — Dashboard</title>
  <link rel="icon" href="/favicon.svg">
  <script src="/theme-init.js?v=2"></script>
  <link rel="preload" as="script" href="/js/dashboard-bundle.js?v=2">
  <link rel="stylesheet" href="/css/app.css?v=2">
</head>
<body class="app-page">
  <header class="app-header">
    <div class="header-left">
      <svg class="app-logo-svg" viewBox="0 0 60 60" width="28" height="28" aria-hidden="true">
        <circle cx="30" cy="30" r="28" fill="none" stroke="#0052cc" stroke-width="3"/>
        <circle cx="30" cy="30" r="16" fill="none" stroke="#0052cc" stroke-width="2" opacity="0.5"/>
        <circle cx="30" cy="30" r="6" fill="#0052cc"/>
      </svg>
      <span class="app-name">Circular Planner</span>
    </div>
    <div class="header-right">
      <span id="header-username" class="header-user"></span>
      <button id="theme-toggle" class="btn-theme" title="Toggle dark mode">🌙</button>
      <button id="logout-btn" class="btn btn-ghost">Sign Out</button>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="global-search-wrap" style="position:relative;margin-bottom:20px;">
      <input type="search" id="global-search-input" placeholder="Search activities and planners…" autocomplete="off" style="width:100%;max-width:560px;padding:8px 10px;border:1px solid var(--cp-border-strong);border-radius:6px;font-size:13px;font-family:inherit;color:var(--cp-text);background:var(--cp-surface);box-sizing:border-box;" />
      <div id="global-search-results" class="hidden" style="position:absolute;top:100%;left:0;right:0;max-width:560px;background:var(--cp-bg);border:1px solid var(--cp-border);border-radius:6px;margin-top:4px;max-height:400px;overflow-y:auto;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,0.1);"></div>
    </div>

    <div class="dashboard-title-row">
      <h2>My Planners</h2>
      <button id="new-planner-btn" class="btn btn-primary">+ New Planner</button>
    </div>

    <div id="planners-grid" class="planners-grid">
      <!-- skeleton cards shown while fetch is pending -->
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton sk-title"></div><div class="skeleton sk-dates"></div><div class="skeleton sk-badge"></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton sk-title"></div><div class="skeleton sk-dates"></div><div class="skeleton sk-badge"></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton sk-title"></div><div class="skeleton sk-dates"></div><div class="skeleton sk-badge"></div></div>
    </div>

    <div class="dashboard-title-row" style="margin-top:36px;">
      <h2>My Groups</h2>
      <a href="/groups.html" class="btn btn-ghost">Manage Groups</a>
    </div>
    <div id="groups-grid" class="planners-grid">
      <!-- skeleton cards shown while fetch is pending -->
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton sk-title"></div><div class="skeleton sk-dates"></div><div class="skeleton sk-badge"></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton sk-title"></div><div class="skeleton sk-dates"></div><div class="skeleton sk-badge"></div></div>
    </div>
  </main>

  <!-- New planner dialog -->
  <div id="new-planner-overlay" class="overlay hidden">
    <div class="dialog-card">
      <h3>New Planner</h3>
      <div id="new-planner-error" class="form-error hidden"></div>
      <form id="new-planner-form">
        <label>
          Title
          <input type="text" id="np-title" placeholder="e.g. 2026 Roadmap" required>
        </label>
        <div class="form-row">
          <label>
            Start date
            <input type="date" id="np-start" required>
          </label>
          <label>
            End date
            <input type="date" id="np-end" required>
          </label>
        </div>
        <div class="dialog-actions">
          <button type="button" id="np-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/dashboard-bundle.js?v=2"></script>
</body>
</html>
