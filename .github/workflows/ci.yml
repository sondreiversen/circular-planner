name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-secret-at-least-32-characters-long-x
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build:client
      - run: npm run check:client
      - run: npm test

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -timeout 3m
