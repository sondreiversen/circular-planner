name: CI

on:
  push:
    branches: [main, go-backend]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 1.24+, not the 1.22 in go.mod: the auth and groups tests call
          # testing.T.Context, which did not exist before Go 1.24. The non-test
          # code still builds on 1.22, so go.mod's floor is left alone.
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:client
      - run: go build ./...
      - run: go test ./... -race -timeout 2m

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: ./scripts/check-clock-usage.sh
      - run: npm run build:client
      - run: npm test
